# CodeDeploy AppSpec for ECS blue/green deployment.
# The TaskDefinition placeholder is replaced by CodePipeline using imageDetail.json.
version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: <TASK_DEFINITION>
        LoadBalancerInfo:
          ContainerName: "app"
          ContainerPort: 8080
        PlatformVersion: "LATEST"
